```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Anas²</title>

    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/open-iconic-bootstrap.css">
    <link rel="stylesheet" href="css/checkout.css">
</head>

<body>

    <!-- Cabeçalho -->
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1 style="color: #FF1493">Ótima escolha!</h1>
            <p class="lead" style="color: #FF1493">Obrigado por comprar na Anas²!</p>
            <p style="color: #FF1493"> Preencha seus dados para efetivar a compra.</p>
        </div>
    </div>

    <!-- Conteúdo principal -->
    <div class="container">
        <div class="row">

            <!-- Resumo da compra -->
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-header">
                        <h2 style="color: #FF1493"> Sua compra</h2>
                    </div>

                    <div class="card-body">
                        <img src="img/produtos/blush_coral.png"
                             alt="Blush Coral"
                             class="img-thumbnail mb-3">

                        <dl>
                            <dt style="color: #FF1493"> Produto </dt>
                            <dd>Blush Coral</dd>

                            <dt style="color: #FF1493"> Cor</dt>
                            <dd>Coral</dd>

                            <dt style="color: #FF1493"> Preço</dt>
                            <dd>R$ 48,00</dd>
                        </dl>
                    </div>
                </div>
            </div>

            <!-- Formulário -->
            <form class="col-md-8">

                <div class="row">

                    <!-- Dados pessoais -->
                    <fieldset class="col-lg-6">
                        <legend style="color: #FF1493"> Dados pessoais</legend>

                        <div class="form-group">
                            <label for="nome" style="color: #FF1493"> Nome completo </label>
                            <input type="text"
                                   class="form-control"
                                   id="nome"
                                   name="nome"
                                   autofocus
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="email" style="color: #FF1493"> Email</label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="email@exemplo.com">
                        </div>

                        <div class="form-group">
                            <label for="cpf" style="color: #FF1493"> CPF</label>
                            <input type="text"
                                   class="form-control"
                                   id="cpf"
                                   name="cpf"
                                   placeholder="000.000.000-00"
                                   required>
                        </div>

                        <div class="form-group custom-control custom-checkbox">
                            <input type="checkbox"
                                   class="custom-control-input"
                                   id="newsletter"
                                   value="sim"
                                   checked>

                            <label class="custom-control-label" for="newsletter" style="color: #FF1493">
                                Quero receber Newsletter da Anas²
                            </label>
                        </div>
                    </fieldset>

                    <!-- Cartão de crédito -->
                    <fieldset class="col-lg-6">
                        <legend style="color: #FF1493">Cartão de crédito</legend>

                        <div class="form-group">
                            <label for="numero-cartao" style="color: #FF1493">Número - CVV</label>
                            <input type="text"
                                   class="form-control"
                                   id="numero-cartao"
                                   name="numero-cartao">
                        </div>

                        <div class="form-group">
                            <label for="bandeira-cartao" style="color: #FF1493">Bandeira</label>

                            <select class="custom-select" id="bandeira-cartao">
                                <option selected disabled>
                                    Selecione uma opção...
                                </option>
                                <option value="master">MasterCard</option>
                                <option value="visa">VISA</option>
                                <option value="amex">American Express</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="validade-cartao" style="color: #FF1493"> Validade</label>
                            <input type="month"
                                   class="form-control"
                                   id="validade-cartao"
                                   name="validade-cartao">
                        </div>
                    </fieldset>

                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="color: #FF1493">
                    <span class="oi oi-thumb-up"></span>
                    Confirmar Pedido
                </button>

            </form>

        </div>
    </div>

    <!-- Rodapé -->
     <footer>
			<div class="container">
				<img src="img/logo-rodape.png"	alt="Logo	da	Mirror	Fashion">
				<ul	class="social">
					<li><a	href="http://youtube.com/anas2.beauty">Youtube</a></li>
					<li><a	href="http://x.com/anas2_beauty">X</a></li>
					<li><a	href="http://instagram.com/anas2.beauty">Instagram</a></li>
				</ul>
			</div>
        </footer>

    <!-- Scripts Bootstrap -->
    <script src="js/jquery.js"></script>
    <script src="js/popper.js"></script>
    <script src="js/bootstrap.js"></script>

</body>
</html>
